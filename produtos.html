<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos da Loja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background:#f0f2f5;
      padding:20px;
    }
    .topo {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }
    .container {
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    }
    input, button {
      width:100%;
      padding:8px;
      margin:6px 0;
      border-radius:6px;
      border:1px solid #ccc;
    }
    button {
      background:#007BFF;
      color:white;
      border:none;
      cursor:pointer;
    }
    .voltar { background:#6c757d; }
    .sair { background:#dc3545; }
  </style>
</head>
<body>

<div class="topo">
  <h2>🧺 Produtos da Loja</h2>
  <div>
    <button class="voltar" onclick="voltar()">⬅ Voltar</button>
    <button class="sair" onclick="sair()">🚪 Sair</button>
  </div>
</div>

<div class="container">
  <h3>➕ Adicionar Produto</h3>
  <input id="nome" placeholder="Nome do produto">
  <input id="preco" type="number" step="0.01" placeholder="Preço">
  <input id="estoque" type="number" placeholder="Estoque">
  <button onclick="addProduto()">Salvar Produto</button>
</div>

<div id="lista"></div>

<script>
const supabase = window.supabase.createClient(
  "https://ufewucxlmuyrekuimvmw.supabase.co",
  "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ"
)

const storeId = new URLSearchParams(location.search).get("store_id")
let user = null

// 🔐 GARANTE SESSÃO ANTES DE QUALQUER AÇÃO
async function init() {
  const { data, error } = await supabase.auth.getUser()

  if (error || !data.user || !storeId) {
    window.location.href = "painel.html"
    return
  }

  user = data.user
  carregar()
}

init()

// ➕ CADASTRAR PRODUTO
async function addProduto() {
  const nome = document.getElementById("nome").value.trim()
  const preco = document.getElementById("preco").value
  const estoque = document.getElementById("estoque").value

  if (!nome || !preco) {
    alert("Informe nome e preço")
    return
  }

  const { error } = await supabase.from("products").insert({
    store_id: storeId,
    nome,
    preco,
    estoque
  })

  if (error) {
    alert("Erro ao salvar produto: " + error.message)
    return
  }

  document.getElementById("nome").value = ""
  document.getElementById("preco").value = ""
  document.getElementById("estoque").value = ""

  carregar()
}

// 📦 LISTAR PRODUTOS
async function carregar() {
  const { data, error } = await supabase
    .from("products")
    .select("*")
    .eq("store_id", storeId)
    .order("created_at", { ascending: false })

  if (error) {
    alert("Erro ao carregar produtos")
    return
  }

  const div = document.getElementById("lista")
  div.innerHTML = ""

  if (data.length === 0) {
    div.innerHTML = "<p>Nenhum produto cadastrado.</p>"
    return
  }

  data.forEach(p => {
    div.innerHTML += `
      <div class="container">
        <strong>${p.nome}</strong><br>
        Preço: R$ ${Number(p.preco).toFixed(2)}<br>
        Estoque: ${p.estoque ?? 0}
      </div>
    `
  })
}

// ⬅ VOLTAR
function voltar() {
  window.location.href = "painel.html"
}
