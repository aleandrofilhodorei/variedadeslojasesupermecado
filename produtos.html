<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produtos da Loja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h2>🧺 Produtos da Loja</h2>

<input id="nome" placeholder="Nome do produto">
<input id="preco" placeholder="Preço">
<input id="estoque" placeholder="Estoque">
<button onclick="addProduto()">Salvar Produto</button>

<div id="lista"></div>

<script>
const supabase = window.supabase.createClient(
  "https://ufewucxlmuyrekuimvmw.supabase.co",
  "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ"
)

const storeId = new URLSearchParams(window.location.search).get("store_id")

if (!storeId) {
  alert("Loja inválida")
  location.href = "painel.html"
}

async function addProduto() {
  const nome = document.getElementById("nome").value
  const preco = document.getElementById("preco").value
  const estoque = document.getElementById("estoque").value

  const { error } = await supabase.from("products").insert({
    store_id: storeId,
    nome,
    preco,
    estoque
  })

  if (error) {
    alert(error.message)
    return
  }

  carregar()
}

async function carregar() {
  const { data } = await supabase
    .from("products")
    .select("*")
    .eq("store_id", storeId)

  const div = document.getElementById("lista")
  div.innerHTML = ""

  data.forEach(p => {
    div.innerHTML += `
      <p>${p.nome} - R$ ${p.preco}</p>
    `
  })
}

carregar()
</script>

</body>
</html>
