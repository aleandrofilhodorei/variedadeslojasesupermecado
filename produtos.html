<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos da Loja</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background:#f0f2f5;
      padding:20px;
    }
    .container {
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    }
    input, button {
      width:100%;
      padding:8px;
      margin:5px 0;
      border-radius:6px;
      border:1px solid #ccc;
    }
    button {
      background:#007BFF;
      color:white;
      border:none;
      cursor:pointer;
    }
    button:hover {
      background:#0056b3;
    }
    .produto {
      border-bottom:1px solid #ddd;
      padding:10px 0;
    }
  </style>
</head>
<body>

<h1>📦 Produtos da Loja</h1>

<div class="container">
  <h3>➕ Adicionar Produto</h3>
  <input id="nome" placeholder="Nome do produto">
  <input id="descricao" placeholder="Descrição">
  <input id="preco" type="number" step="0.01" placeholder="Preço">
  <input id="estoque" type="number" placeholder="Estoque">
  <button onclick="salvarProduto()">Salvar Produto</button>
</div>

<div id="produtos"></div>

<script>
const SUPABASE_URL = "https://ufewucxlmuyrekuimvmw.supabase.co"
const SUPABASE_KEY = "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ"

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
)

let lojaId = null

document.addEventListener("DOMContentLoaded", async () => {

  // 🔐 verifica login
  const { data: authData } = await supabase.auth.getUser()

  if (!authData.user) {
    alert("Você precisa estar logado")
    window.location.href = "index.html"
    return
  }

  // 🏪 busca a loja do usuário
  const { data: loja, error } = await supabase
    .from("stores")
    .select("id, nome_loja")
    .single()

  if (error || !loja) {
    alert("Nenhuma loja encontrada")
    return
  }

  lojaId = loja.id
  carregarProdutos()
})

// ➕ salvar produto
async function salvarProduto() {
  const nome = document.getElementById("nome").value.trim()
  const descricao = document.getElementById("descricao").value.trim()
  const preco = document.getElementById("preco").value
  const estoque = document.getElementById("estoque").value

  if (!nome || !preco) {
    alert("Informe nome e preço")
    return
  }

  const { error } = await supabase.from("products").insert({
    store_id: lojaId,
    nome,
    descricao,
    preco,
    estoque
  })

  if (error) {
    alert("Erro ao salvar produto: " + error.message)
    return
  }

  document.getElementById("nome").value = ""
  document.getElementById("descricao").value = ""
  document.getElementById("preco").value = ""
  document.getElementById("estoque").value = ""

  carregarProdutos()
}

// 📦 listar produtos
async function carregarProdutos() {
  const { data, error } = await supabase
    .from("products")
    .select("*")
    .eq("store_id", lojaId)
    .order("created_at", { ascending: false })

  if (error) {
    alert("Erro ao carregar produtos: " + error.message)
    return
  }

  const container = document.getElementById("produtos")
  container.innerHTML = ""

  if (data.length === 0) {
    container.innerHTML = "<p>Nenhum produto cadastrado.</p>"
    return
  }

  data.forEach(produto => {
    const div = document.createElement("div")
    div.className = "container produto"
    div.innerHTML = `
      <strong>${produto.nome}</strong><br>
      <small>${produto.descricao || ""}</small><br>
      💰 R$ ${Number(produto.preco).toFixed(2)} |
      📦 Estoque: ${produto.estoque}
    `
    container.appendChild(div)
  })
}
</script>

</body>
</html>
