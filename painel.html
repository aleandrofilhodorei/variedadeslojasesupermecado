<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  padding:20px;
}
button{
  padding:12px;
  background:#ff9800;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>📊 Painel do Usuário</h1>
<p id="usuario"></p>
<button onclick="logout()">Sair</button>

<script>
const SUPABASE_URL = "https://ufewucxlmuyrekuimvmw.supabase.co";
const SUPABASE_KEY = "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ";

const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);

async function carregar(){
  const { data } = await supabase.auth.getUser();
  if(!data.user){
    window.location.href = "index.html";
  }else{
    usuario.innerText = "Logado como: " + data.user.email;
  }
}

async function logout(){
  await supabase.auth.signOut();
  window.location.href = "index.html";
}

carregar();
</script>

</body>
</html>
