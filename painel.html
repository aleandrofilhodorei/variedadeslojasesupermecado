<body>

<h1>🏪 Painel de Lojas</h1>

<div class="container">
  <h3>Adicionar Loja</h3>
  <input id="nome" placeholder="Nome da loja">
  <input id="descricao" placeholder="Descrição">
  <button onclick="addLoja()">Salvar Loja</button>
</div>

<div id="lojas"></div>

<script>
const supabaseUrl = "https://ufewucxlmuyrekuimvmw.supabase.co"
const supabaseKey = "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ"

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)
let user = null

async function init() {
  const { data } = await supabase.auth.getUser()

  if (!data.user) {
    alert("Faça login primeiro")
    window.location.href = "index.html"
    return
  }

  user = data.user
  carregarLojas()
}

async function addLoja() {
  const nome = document.getElementById("nome").value
  const descricao = document.getElementById("descricao").value

  const { error } = await supabase.from("stores").insert({
    nome_loja: nome,
    descricao: descricao,
    user_id: user.id
  })

  if (error) return alert(error.message)

  document.getElementById("nome").value = ""
  document.getElementById("descricao").value = ""
  carregarLojas()
}
