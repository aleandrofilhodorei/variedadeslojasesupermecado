<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Lojas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background:#f0f2f5;
      padding:20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .topo {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }
    .sair {
      background:#dc3545;
    }
    .container {
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:20px;
    }
    input, button {
      padding:8px;
      margin:5px 0;
      width:100%;
      border-radius:6px;
      border:1px solid #ccc;
    }
    button {
      background:#007BFF;
      color:white;
      border:none;
      cursor:pointer;
    }
    button:hover {
      background:#0056b3;
    }
    .loja {
      margin-top:10px;
    }
    .gerenciar {
      margin-top:10px;
      background:#28a745;
    }
  </style>
</head>
<body>

<div class="topo">
  <h1>🏪 Painel de Lojas</h1>
  <button class="sair" onclick="sair()">🚪 Sair</button>
</div>

<div class="container">
  <h3>➕ Adicionar Loja</h3>
  <input id="nome" placeholder="Nome da loja">
  <input id="descricao" placeholder="Descrição">
  <button onclick="addLoja()">Salvar Loja</button>
</div>

<div id="lojas"></div>

<script>
const supabase = window.supabase.createClient(
  "https://ufewucxlmuyrekuimvmw.supabase.co",
  "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ"
)

let user = null

// 🔐 PROTEÇÃO DO PAINEL
async function verificarLogin() {
  const { data } = await supabase.auth.getUser()

  if (!data.user) {
    window.location.href = "index.html"
    return
  }

  user = data.user
  carregarLojas()
}

verificarLogin()

// 🚪 SAIR
async function sair() {
  await supabase.auth.signOut()
  window.location.href = "index.html"
}

// ➕ ADICIONAR LOJA
async function addLoja() {
  const nome = document.getElementById("nome").value.trim()
  const descricao = document.getElementById("descricao").value.trim()

  if (!nome) {
    alert("Informe o nome da loja")
    return
  }

  const { error } = await supabase.from("stores").insert({
    nome_loja: nome,
    descricao: descricao,
    user_id: user.id
  })

  if (error) {
    alert("Erro ao salvar loja: " + error.message)
    return
  }

  document.getElementById("nome").value = ""
  document.getElementById("descricao").value = ""
  carregarLojas()
}

// 📦 LISTAR LOJAS (ORDEM CERTA)
async function carregarLojas() {
  const { data, error } = await supabase
    .from("stores")
    .select("*")
    .order("created_at", { ascending: false })

  if (error) {
    alert("Erro ao carregar lojas: " + error.message)
    return
  }

  const container = document.getElementById("lojas")
  container.innerHTML = ""

  if (data.length === 0) {
    container.innerHTML = "<p>Nenhuma loja cadastrada.</p>"
    return
  }

  data.forEach(loja => {
    const div = document.createElement("div")
    div.className = "container loja"
    div.innerHTML = `
      <strong>${loja.nome_loja}</strong><br>
      <small>${loja.descricao || ""}</small><br>
      <button class="gerenciar" onclick="gerenciar('${loja.id}')">
        📦 Gerenciar Produtos
      </button>
    `
    container.appendChild(div)
  })
}

// 📦 ABRIR PRODUTOS DA LOJA
function gerenciar(storeId) {
  window.location.href = `produtos.html?store_id=${storeId}`
}
</script>

</body>
</html>
