<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plataforma de Lojas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1f1f1f;
  padding:30px;
  border-radius:10px;
  width:100%;
  max-width:350px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button{
  background:#ff9800;
  font-weight:bold;
  cursor:pointer;
}
p{
  text-align:center;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔐 Login</h2>
  <input id="email" placeholder="Email">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>

  <hr style="margin:20px 0;opacity:.3">

  <h2>📝 Cadastro</h2>
  <input id="emailCad" placeholder="Email">
  <input id="senhaCad" type="password" placeholder="Senha">
  <button onclick="cadastrar()">Cadastrar</button>

  <p id="msg"></p>
</div>

<script>
const SUPABASE_URL = "https://ufewucxlmuyrekuimvmw.supabase.co";
const SUPABASE_KEY = "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ";

const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_KEY);

// LOGIN
async function login(){
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: senha.value
  });

  if(error){
    msg.innerText = "❌ Login inválido";
  }else{
    window.location.href = "painel.html";
  }
}

// CADASTRO
async function cadastrar(){
  const { error } = await supabase.auth.signUp({
    email: emailCad.value,
    password: senhaCad.value
  });

  if(error){
    msg.innerText = "❌ Erro ao cadastrar";
  }else{
    msg.innerText = "✅ Cadastro realizado! Faça login.";
  }
}
</script>

</body>
</html>
