<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Plataforma</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1f1f1f;
  padding:30px;
  border-radius:10px;
  width:100%;
  max-width:350px;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button{
  background:#ff9800;
  font-weight:bold;
  cursor:pointer;
}
#msg{
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔐 Login</h2>

  <input 
    id="email" 
    type="email"
    value="aleandrofilhodorei@gmail.com"
    placeholder="Email"
  >

  <input 
    id="senha" 
    type="password"
    placeholder="Senha"
  >

  <button onclick="login()">Entrar</button>

  <p id="msg"></p>
</div>

<script>
const SUPABASE_URL = "https://ufewucxlmuyrekuimvmw.supabase.co";
const SUPABASE_KEY = "sb_publishable_XdL_tfSBfAAfR2tqJxB5rA_CipP1mXJ";

const supabase = supabaseJs.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login(){
  msg.innerText = "Entrando...";

  const { error } = await supabase.auth.signInWithPassword({
    email: email.value.trim(),
    password: senha.value.trim()
  });

  if(error){
    msg.innerText = "❌ Email ou senha inválidos";
    console.error(error);
  }else{
    window.location.href = "painel.html";
  }
}
</script>

</body>
</html>
